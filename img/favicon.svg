<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified version for favicon -->
  <rect width="32" height="32" fill="white"/>
  
  <!-- Abstract Robot Brain -->
  <g transform="translate(16, 16)">
    <!-- Outer circle representing the brain/head -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#1a365d" stroke-width="1.2"/>
    
    <!-- Inner neural connections -->
    <circle cx="-4" cy="-4" r="1.5" fill="none" stroke="#1a365d" stroke-width="0.8"/>
    <circle cx="4" cy="-4" r="1.5" fill="none" stroke="#1a365d" stroke-width="0.8"/>
    <circle cx="-4" cy="4" r="1.5" fill="none" stroke="#1a365d" stroke-width="0.8"/>
    <circle cx="4" cy="4" r="1.5" fill="none" stroke="#1a365d" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="none" stroke="#1a365d" stroke-width="0.8"/>
    
    <!-- Connecting circuit lines -->
    <line x1="-4" y1="-4" x2="4" y2="-4" stroke="#00bcd4" stroke-width="0.8"/>
    <line x1="-4" y1="4" x2="4" y2="4" stroke="#00bcd4" stroke-width="0.8"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#00bcd4" stroke-width="0.8"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#00bcd4" stroke-width="0.8"/>
  </g>
</svg>