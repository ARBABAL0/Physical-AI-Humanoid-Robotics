<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Abstract Robot Brain -->
  <g transform="translate(100, 100)">
    <!-- Outer circle representing the brain/head -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1a365d" stroke-width="4"/>
    
    <!-- Inner neural connections -->
    <circle cx="-20" cy="-20" r="8" fill="none" stroke="#1a365d" stroke-width="2"/>
    <circle cx="20" cy="-20" r="8" fill="none" stroke="#1a365d" stroke-width="2"/>
    <circle cx="-20" cy="20" r="8" fill="none" stroke="#1a365d" stroke-width="2"/>
    <circle cx="20" cy="20" r="8" fill="none" stroke="#1a365d" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#1a365d" stroke-width="2"/>
    
    <!-- Connecting circuit lines -->
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#00bcd4" stroke-width="2"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#00bcd4" stroke-width="2"/>
    <line x1="-20" y1="-20" x2="-20" y2="20" stroke="#00bcd4" stroke-width="2"/>
    <line x1="20" y1="-20" x2="20" y2="20" stroke="#00bcd4" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#00bcd4" stroke-width="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#00bcd4" stroke-width="2"/>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#00bcd4" stroke-width="2"/>
    <line x1="14" y1="-14" x2="-14" y2="14" stroke="#00bcd4" stroke-width="2"/>
  </g>
  
  <!-- Book/knowledge symbol -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="80" height="30" rx="4" ry="4" fill="none" stroke="#1a365d" stroke-width="3"/>
    <line x1="10" y1="5" x2="10" y2="25" stroke="#1a365d" stroke-width="2"/>
    <line x1="20" y1="5" x2="20" y2="25" stroke="#1a365d" stroke-width="2"/>
    <line x1="30" y1="5" x2="30" y2="25" stroke="#1a365d" stroke-width="2"/>
    <line x1="40" y1="5" x2="40" y2="25" stroke="#1a365d" stroke-width="2"/>
    <line x1="50" y1="5" x2="50" y2="25" stroke="#1a365d" stroke-width="2"/>
    <line x1="60" y1="5" x2="60" y2="25" stroke="#1a365d" stroke-width="2"/>
    <line x1="70" y1="5" x2="70" y2="25" stroke="#1a365d" stroke-width="2"/>
  </g>
</svg>